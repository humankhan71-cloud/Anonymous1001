<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <style>
        * { box-sizing: border-box; font-family: Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f2f5; color: #050505; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: #f0f2f5; min-height: 100vh; }
        .fb-header { background: #ffffff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dadde1; position: sticky; top: 0; z-index: 100; }
        .fb-logo { color: #1877f2; font-size: 28px; font-weight: bold; letter-spacing: -1.5px; }
        .card { background: #ffffff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 10px; }
        .auth-container { padding: 20px; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .auth-logo { color: #1877f2; font-size: 40px; font-weight: bold; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; margin: 6px 0; border-radius: 6px; border: 1px solid #ccd0d5; font-size: 15px; outline: none; }
        button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-primary { background: #1877f2; color: #fff; }
        .btn-success { background: #42b72a; color: #fff; }
        .tab-group { display: flex; background: #ddd; border-radius: 6px; padding: 3px; margin-bottom: 15px; }
        .tab-btn { background: transparent; border: none; padding: 8px; font-weight: bold; cursor: pointer; flex: 1; border-radius: 4px; color: #4b4f56; }
        .tab-btn.active { background: #fff; color: #1877f2; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #dadde1; }
        .post-card { background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 8px; padding: 12px; }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .post-image { width: 100%; max-height: 400px; object-fit: cover; margin-top: 8px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Auth Screen -->
    <div class="auth-container" id="authBox">
        <div class="auth-logo">facebook</div>
        <div style="font-size: 15px; color: #606770; margin-bottom: 20px;">Connect with friends on Facebook.</div>

        <div class="card" style="text-align: left;">
            <div class="tab-group">
                <button class="tab-btn active" id="btnLoginTab" onclick="switchTab('login')">Log In</button>
                <button class="tab-btn" id="btnSignupTab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <div id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email">
                <input type="password" id="loginPassword" placeholder="Password">
                <button class="btn-primary" onclick="handleLogin()">Log In</button>
            </div>

            <div id="signupForm" style="display: none;">
                <input type="text" id="regFullName" placeholder="Full Name">
                <input type="text" id="regUsername" placeholder="Username (e.g. rashidumrani60)">
                <input type="email" id="regEmail" placeholder="Email">
                <input type="password" id="regPassword" placeholder="Password">
                <button class="btn-success" onclick="handleSignup()">Create Account</button>
            </div>
        </div>
    </div>

    <!-- Feed Screen -->
    <div id="feedBox" style="display: none;">
        <div class="fb-header">
            <div class="fb-logo">facebook</div>
            <button class="btn-primary" style="width: auto; padding: 6px 12px; font-size: 13px;" onclick="handleLogout()">Logout</button>
        </div>

        <div class="card">
            <textarea id="postContent" rows="2" placeholder="What's on your mind?"></textarea>
            <input type="text" id="postImageUrl" placeholder="Image URL (Optional)">
            <button class="btn-primary" onclick="createPost()">Post</button>
        </div>

        <div id="postsContainer"></div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, query, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBatSGz6VLnIUJGo4wTLrKMDxfX6sRezng",
    authDomain: "anonymous1001-d2a27.firebaseapp.com",
    projectId: "anonymous1001-d2a27",
    storageBucket: "anonymous1001-d2a27.appspot.com",
    messagingSenderId: "668671657253",
    appId: "1:668671657253:web:203f5154f7b329595446cc"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUserData = { name: "User", photo: "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
        try {
            const docSnap = await getDoc(doc(db, "users", user.uid));
            if(docSnap.exists()) {
                currentUserData = docSnap.data();
            }
        } catch(e) { console.log(e); }
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('feedBox').style.display = 'block';
        loadPosts();
    } else {
        document.getElementById('authBox').style.display = 'flex';
        document.getElementById('feedBox').style.display = 'none';
    }
  });

  window.switchTab = (tab) => {
    if(tab === 'login') {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('signupForm').style.display = 'none';
        document.getElementById('btnLoginTab').classList.add('active');
        document.getElementById('btnSignupTab').classList.remove('active');
    } else {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('signupForm').style.display = 'block';
        document.getElementById('btnSignupTab').classList.add('active');
        document.getElementById('btnLoginTab').classList.remove('active');
    }
  };

  window.handleSignup = async () => {
    const name = document.getElementById('regFullName').value.trim();
    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value.trim();

    if(!name || !email || !password || !username) {
        alert("Please fill all fields!");
        return;
    }

    try {
        const res = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", res.user.uid), {
            uid: res.user.uid,
            name: name,
            username: username.startsWith('@') ? username : '@' + username,
            email: email,
            photo: "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png"
        });
        alert("Account created successfully!");
    } catch(err) { alert(err.message); }
  };

  window.handleLogin = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    try {
        await signInWithEmailAndPassword(auth, email, password);
    } catch(err) { alert(err.message); }
  };

  window.handleLogout = async () => {
    await signOut(auth);
  };

  window.createPost = async () => {
    const text = document.getElementById('postContent').value.trim();
    const image = document.getElementById('postImageUrl').value.trim();
    if(!text && !image) return alert("Write something!");

    try {
        await addDoc(collection(db, "posts"), {
            authorName: currentUserData.name,
            authorPhoto: currentUserData.photo || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png",
            text: text,
            image: image,
            likes: 0,
            timestamp: Date.now()
        });
        document.getElementById('postContent').value = '';
        document.getElementById('postImageUrl').value = '';
    } catch(err) { alert(err.message); }
  };

  function loadPosts() {
    const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
        const container = document.getElementById('postsContainer');
        container.innerHTML = '';
        snapshot.forEach((docSnap) => {
            const post = docSnap.data();
            const imgTag = post.image ? `<img src="${post.image}" class="post-image">` : '';
            container.innerHTML += `
                <div class="post-card">
                    <div class="post-header">
                        <img src="${post.authorPhoto}" class="avatar">
                        <div><b>${post.authorName}</b></div>
                    </div>
                    <div>${post.text}</div>
                    ${imgTag}
                </div>
            `;
        });
    });
  }
</script>
</body>
</html>
