<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi - Chat App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 450px; background: white; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        @media(min-width: 480px) { .container { height: 85vh; border-radius: 10px; } }
        .header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .screen { flex: 1; display: flex; flex-direction: column; padding: 20px; justify-content: center; align-items: center; }
        .hidden { display: none !important; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #25d366; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #1ebe5d; }
        .chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: #e5ded8; }
        .message { max-width: 70%; padding: 10px; border-radius: 8px; font-size: 14px; word-break: break-word; }
        .incoming { background: white; align-self: flex-start; }
        .outgoing { background: #dcf8c6; align-self: flex-end; }
        .chat-input-area { display: flex; padding: 10px; background: #f0f0f0; gap: 10px; }
        .chat-input-area input { margin: 0; flex: 1; }
        .chat-input-area button { width: 80px; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Hi</div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
        <h2>Login with Phone</h2>
        <input type="text" id="phone-number" placeholder="Phone (+923001234567)">
        <button id="send-otp-btn">Send OTP</button>
        <div id="recaptcha-container"></div>
        
        <div id="otp-box" class="hidden" style="width: 100%; margin-top: 20px;">
            <input type="text" id="otp-code" placeholder="Enter 6-digit OTP">
            <button id="verify-otp-btn">Verify OTP</button>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen hidden" style="padding: 0;">
        <div id="chat-messages" class="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button id="send-msg-btn">Send</button>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Yahan apni Firebase Console ki config details dalein
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    auth.languageCode = 'en';

    window.addEventListener('load', () => {
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            'size': 'invisible',
            'callback': (response) => {
                // reCAPTCHA solved
            }
        });
    });

    document.getElementById('send-otp-btn').addEventListener('click', () => {
        const phoneNumber = document.getElementById('phone-number').value;
        const appVerifier = window.recaptchaVerifier;
        
        signInWithPhoneNumber(auth, phoneNumber, appVerifier)
            .then((confirmationResult) => {
                window.confirmationResult = confirmationResult;
                alert("OTP Sent Successfully!");
                document.getElementById('otp-box').classList.remove('hidden');
            }).catch((error) => {
                console.error("SMS Error:", error);
                alert("Error sending OTP: " + error.message);
            });
    });

    document.getElementById('verify-otp-btn').addEventListener('click', () => {
        const code = document.getElementById('otp-code').value;
        window.confirmationResult.confirm(code).then((result) => {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            loadMessages();
        }).catch((error) => {
            alert("Invalid OTP Code: " + error.message);
        });
    });

    document.getElementById('send-msg-btn').addEventListener('click', async () => {
        const text = document.getElementById('msg-input').value;
        if(text.trim() === "") return;
        
        await addDoc(collection(db, "messages"), {
            text: text,
            uid: auth.currentUser.uid,
            phone: auth.currentUser.phoneNumber,
            createdAt: serverTimestamp()
        });
        document.getElementById('msg-input').value = "";
    });

    function loadMessages() {
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = `message ${data.uid === auth.currentUser.uid ? 'outgoing' : 'incoming'}`;
                div.innerText = `${data.text}`;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }
</script>

</body>
</html>
