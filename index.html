<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous1001</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0c10; color: #c5c6c7; padding-bottom: 40px; }
    
    header { background: #1f2833; color: #66fcf1; padding: 12px 20px; font-size: 20px; font-weight: bold; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #66fcf1; box-shadow: 0 0 15px rgba(102, 252, 241, 0.2); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .mask-icon { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #66fcf1; }
    
    .container { max-width: 500px; margin: auto; padding: 12px; }
    .card { background: #1f2833; padding: 18px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #45a29e; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    input[type="email"], input[type="password"], textarea, input[type="text"], input[type="file"] { width: 100%; margin-top: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid #45a29e; background: #0b0c10; color: #fff; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #66fcf1; box-shadow: 0 0 8px rgba(102, 252, 241, 0.4); }
    
    .btn { width: 100%; margin-top: 10px; padding: 11px; border-radius: 8px; border: none; background: #66fcf1; color: #0b0c10; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-green { background: #00ff87; color: #0b0c10; }
    .btn-danger { background: #ff4757; color: #fff; margin-top: 10px; }
    
    .post-header { font-weight: bold; font-size: 14px; color: #66fcf1; margin-bottom: 8px; display: flex; justify-content: space-between; border-bottom: 1px solid #45a29e; padding-bottom: 6px; }
    .post-time { font-size: 11px; color: #c5c6c7; font-weight: normal; }
    .post-text { font-size: 15px; margin: 8px 0; color: #fff; line-height: 1.4; word-wrap: break-word; }
    .post-img { width: 100%; border-radius: 8px; margin-top: 6px; max-height: 380px; object-fit: cover; border: 1px solid #45a29e; }
    
    .reactions-bar { display: flex; justify-content: space-around; margin-top: 12px; border-top: 1px solid #333; padding-top: 8px; }
    .react-btn { background: #0b0c10; color: #c5c6c7; border: 1px solid #45a29e; padding: 6px 12px; font-size: 13px; border-radius: 18px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .react-btn:hover { background: #66fcf1; color: #0b0c10; }
    
    .comments-box { margin-top: 10px; background: #13171d; border-radius: 8px; padding: 8px; }
    .comment-item { font-size: 13px; border-bottom: 1px dashed #333; padding: 4px 0; }
    .comment-user { color: #66fcf1; font-weight: bold; }
    .comment-input-group { display: flex; gap: 6px; margin-top: 6px; }

    .anonymous-logo { width: 90px; height: 90px; margin-bottom: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Anonymous_emblem.svg" class="mask-icon" alt="Mask">
      <span>Anonymous1001</span>
    </div>
    <span id="user-display" style="font-size:12px; color:#66fcf1;"></span>
  </header>

  <div class="container">
    <div id="auth-section" class="card" style="text-align:center;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Anonymous_emblem.svg" class="anonymous-logo" alt="Anonymous Mask">
      <h2 style="color:#66fcf1;">Anonymous Network</h2>
      <p style="font-size:13px; color:#c5c6c7; margin-bottom:12px;">Login or Sign up to connect</p>
      
      <input type="email" id="email" placeholder="Email Address">
      <input type="password" id="password" placeholder="Password">
      <button class="btn" id="login-btn">Log In</button>
      <button class="btn btn-green" id="register-btn">Create New Account</button>
    </div>

    <div id="feed-section" class="hidden">
      <div class="card">
        <h3 style="color:#66fcf1; font-size: 15px;">Create Anonymous Post</h3>
        <textarea id="post-text" rows="3" placeholder="What's on your mind?"></textarea>
        <label style="display: block; margin-top: 8px; font-size: 12px; color: #66fcf1;">Photo Upload Karen:</label>
        <input type="file" id="post-image" accept="image/*">
        <button class="btn" id="post-btn">Post Now</button>
        <button class="btn btn-danger" id="logout-btn">Log Out</button>
      </div>

      <div id="posts-container"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, arrayUnion, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBatSGz6VLnIUJGo4wTLrKMDxfX6sRezng",
      authDomain: "anonymous1001-d2a27.firebaseapp.com",
      projectId: "anonymous1001-d2a27",
      messagingSenderId: "668671657253",
      appId: "1:668671657253:web:203f5154f7b329595446cc",
      measurementId: "G-CSL38PPBX9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Aapki ImgBB API Key yahan set kar di gayi hai
    const IMGBB_API_KEY = "c377499f24cef586d2dd92049ba65a27";

    document.getElementById('register-btn').addEventListener('click', async () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      if (!e || !p) return alert("Email and Password required!");
      try {
        await createUserWithEmailAndPassword(auth, e, p);
        alert("Account Created!");
      } catch (err) { alert(err.message); }
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      if (!e || !p) return alert("Email and Password required!");
      try {
        await signInWithEmailAndPassword(auth, e, p);
      } catch (err) { alert(err.message); }
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    document.getElementById('post-btn').addEventListener('click', async () => {
      const text = document.getElementById('post-text').value;
      const fileInput = document.getElementById('post-image');
      const file = fileInput.files[0];
      let imageUrl = "";

      if (!text && !file) return alert("Text ya image enter karein!");

      document.getElementById('post-btn').innerText = "Uploading...";
      document.getElementById('post-btn').disabled = true;

      try {
        if (file) {
          const formData = new FormData();
          formData.append("image", file);
          
          const response = await fetch(https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}, {
            method: "POST",
            body: formData
          });
          const data = await response.json();
          if(data.success) {
            imageUrl = data.data.url;
          } else {
            alert("Image upload failed!");
          }
        }

        await addDoc(collection(db, "posts"), {
          user: auth.currentUser.email,
          text: text,
          imageUrl: imageUrl,
          likes: 0,
          hearts: 0,
          chappals: 0,
          comments: [],
          timestamp: Date.now()
        });

        document.getElementById('post-text').value = '';
        fileInput.value = '';
      } catch (err) { 
        alert(err.message); 
      } finally {
        document.getElementById('post-btn').innerText = "Post Now";
        document.getElementById('post-btn').disabled = false;
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('feed-section').classList.remove('hidden');
        document.getElementById('user-display').innerText = 👤 ${user.email.split('@')[0]};
        loadPosts();
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('feed-section').classList.add('hidden');
        document.getElementById('user-display').innerText = '';
      }
    });

    function loadPosts() {
      const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('posts-container');
        container.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const id = docSnap.id;
          const postDate = new Date(post.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          
          let commentsHTML = '';
          if (post.comments && post.comments.length > 0) {
            commentsHTML = post.comments.map(c => `
              <div class="comment-item">
                <span class="comment-user">${c.user.split('@')[0]}:</span> ${c.text}
              </div>
            `).join('');
          }

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="post-header">
              <span>👤 ${post.user.split('@')[0]}</span> 
              <span class="post-time">${postDate}</span>
            </div>
            ${post.text ? <div class="post-text">${post.text}</div> : ''}
            ${post.imageUrl ? <img src="${post.imageUrl}" class="post-img"> : ''}
            
            <div class="reactions-bar">
              <button class="react-btn" data-type="likes">👍 Like (${post.likes || 0})</button>
              <button class="react-btn" data-type="hearts">❤️ Heart (${post.hearts || 0})</button>
              <button class="react-btn" data-type="chappals">🩴 Chappal (${post.chappals || 0})</button>
            </div>

            <div class="comments-box">
              <div id="comments-${id}">${commentsHTML}</div>
              <div class="comment-input-group">
                <input type="text" id="input-comm-${id}" placeholder="Write a comment...">
                <button style="width:70px; margin-top:8px;" class="btn send-comment-btn">Send</button>
              </div>
            </div>
          `;

          card.querySelectorAll('.react-btn').forEach(btn => {
            btn.addEventListener('click', () => reactPost(id, btn.getAttribute('data-type')));
          });

          card.querySelector('.send-comment-btn').addEventListener('click', () => addComment(id));

          container.appendChild(card);
        });
      });
    }

    async function reactPost(postId, type) {
      const postRef = doc(db, "posts", postId);
      await updateDoc(postRef, { [type]: increment(1) });
    }

    async function addComment(postId) {
      const input = document.getElementById(input-comm-${postId});
      const text = input.value.trim();
      if (!text) return;

      const postRef = doc(db, "posts", postId);
      await updateDoc(postRef, {
        comments: arrayUnion({
          user: auth.currentUser.email,
          text: text
        })
      });
      input.value = '';
    }
  </script>
</body>
</html>
