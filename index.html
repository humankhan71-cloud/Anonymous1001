<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Social Network</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        
        /* Anonymous Mask Background */
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                        url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e4e6eb; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
        }
        
        .container { width: 100%; max-width: 500px; padding: 10px; }

        .card { background: rgba(36, 37, 38, 0.9); backdrop-filter: blur(5px); border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 12px; border: 1px solid rgba(0, 242, 254, 0.2); }
        .logo { width: 85px; height: 85px; border-radius: 50%; border: 2px solid #00f2fe; margin-bottom: 10px; object-fit: cover; }
        h2 { color: #00f2fe; text-align: center; margin-bottom: 5px; text-shadow: 0 0 5px rgba(0,242,254,0.5); }
        p { color: #b0b3b8; font-size: 14px; text-align: center; margin-bottom: 12px; }

        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #3a3b3c; background: rgba(58, 59, 60, 0.8); color: #fff; font-size: 14px; outline: none; }
        button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 6px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn-primary { background: #00f2fe; color: #000; box-shadow: 0 0 8px rgba(0,242,254,0.4); }
        .btn-success { background: #42b72a; color: #fff; }
        .btn-small { width: auto; padding: 5px 10px; font-size: 12px; margin: 0; }
        .btn-secondary { background: #3a3b3c; color: #e4e6eb; }

        .tab-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { background: #3a3b3c; color: #b0b3b8; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        .tab-btn.active { background: #00f2fe; color: #000; }

        .header-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a3b3c; padding-bottom: 8px; margin-bottom: 10px; }
        .nav-icons { display: flex; gap: 15px; font-size: 18px; cursor: pointer; }

        .search-results { text-align: left; background: #3a3b3c; border-radius: 8px; padding: 8px; display: none; margin-top: 5px; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #4e4f50; }

        .post-card { background: rgba(36, 37, 38, 0.9); backdrop-filter: blur(5px); border-radius: 10px; padding: 12px; margin-bottom: 12px; text-align: left; border: 1px solid rgba(255,255,255,0.05); }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid #00f2fe; }
        .post-image { width: 100%; border-radius: 8px; margin-top: 8px; max-height: 300px; object-fit: cover; }

        .upload-label { display: block; background: #3a3b3c; color: #00f2fe; padding: 8px; border-radius: 6px; text-align: center; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 5px; border: 1px dashed #00f2fe; }
        input[type="file"] { display: none; }

        .reactions-container { position: relative; width: 100%; }
        .post-actions { display: flex; justify-content: space-around; border-top: 1px solid #3a3b3c; border-bottom: 1px solid #3a3b3c; margin-top: 8px; padding: 5px 0; }
        .action-btn { background: none; border: none; color: #b0b3b8; font-size: 13px; width: auto; margin: 0; padding: 5px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        .reaction-box { position: absolute; bottom: 35px; left: 0; background: #3a3b3c; border-radius: 30px; padding: 5px 10px; display: none; gap: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); z-index: 10; }
        .reaction-box span { font-size: 20px; cursor: pointer; transition: transform 0.2s; }
        .reaction-box span:hover { transform: scale(1.3); }

        .comment-section { margin-top: 8px; display: none; }
        .comment-input-group { display: flex; gap: 5px; margin-top: 6px; }
        .comment-input-group input { margin: 0; padding: 6px; font-size: 12px; }
        .comment-list { margin-top: 5px; font-size: 12px; color: #e4e6eb; background: #3a3b3c; padding: 6px 10px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="authBox">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Anonymous_emblem.svg" class="logo" alt="Anonymous Mask Logo">
        <h2>Anonymous Network</h2>
        <p>Connect with friends secretly</p>

        <div class="tab-group">
            <button class="tab-btn active" id="btnLoginTab" onclick="switchTab('login')">Log In</button>
            <button class="tab-btn" id="btnSignupTab" onclick="switchTab('signup')">Create Account</button>
        </div>

        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email Address">
            <input type="password" id="loginPassword" placeholder="Password">
            <button class="btn-primary" onclick="handleAuth('login')">Log In</button>
        </div>

        <div id="signupForm" style="display: none; text-align: left;">
            <input type="text" id="regFullName" placeholder="Full Name">
            <input type="text" id="regUsername" placeholder="Username (@name)">
            <input type="email" id="regEmail" placeholder="Email Address">
            <input type="password" id="regPassword" placeholder="New Password (min 6 chars)">
            <select id="regGender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Custom">Custom / Anonymous</option>
            </select>
            <button class="btn-success" onclick="handleAuth('signup')">Sign Up & Create Account</button>
        </div>
    </div>

    <div id="feedBox" style="display: none;">
        <div class="card header-nav">
            <h3 style="color: #00f2fe;">Anonymous</h3>
            <div class="nav-icons">
                <span title="Invite Friends" onclick="shareAppWithFriends()">📲 Share App</span>
                <span title="Profile" onclick="toggleProfile()">👤</span>
            </div>
        </div>

        <div class="card" style="background: linear-gradient(45deg, #1877f2, #00f2fe); color: #fff; text-align: center;">
            <h4 style="margin-bottom: 5px;">📲 Share with Friends!</h4>
            <p style="color: #fff; font-size: 12px; margin-bottom: 8px;">Invite your friends to create an account and join your anonymous network.</p>
            <button class="btn-secondary" style="background: #000; color: #fff;" onclick="shareAppWithFriends()">💬 Send via WhatsApp / Copy Link</button>
        </div>

        <div class="card" style="padding: 8px;">
            <input type="text" id="searchInput" placeholder="🔍 Search users, friends..." onkeyup="searchUsers()">
            <div id="searchResults" class="search-results"></div>
        </div>

        <div class="card" style="text-align: left;">
            <textarea id="postContent" rows="2" placeholder="What's on your mind?"></textarea>
            
            <label for="imageUpload" class="upload-label">📷 Choose Image from Gallery</label>
            <input type="file" id="imageUpload" accept="image/*" onchange="previewSelectedImage(this)">
            <p id="imagePreviewText" style="font-size: 11px; color: #00f2fe; margin-top: 4px; display: none; text-align: left;"></p>

            <button class="btn-primary" onclick="createPost()">Post</button>
        </div>

        <div class="card" id="profileBox" style="display: none; text-align: left;">
            <h4>👤 My Account Profile</h4>
            <p style="text-align: left;" id="userProfileName"></p>
            <p style="text-align: left;" id="userProfileEmail"></p>
            <button class="btn-secondary btn-small" onclick="location.reload()">Log Out</button>
        </div>

        <div id="postsContainer"></div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBatSGz6VLnIUJGo4wTLrKMDxfX6sRezng",
    authDomain: "anonymous1001-d2a27.firebaseapp.com",
    projectId: "anonymous1001-d2a27",
    storageBucket: "anonymous1001-d2a27.appspot.com",
    messagingSenderId: "668671657253",
    appId: "1:668671657253:web:203f5154f7b329595446cc"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let currentUserName = "Anonymous User";
  let selectedImageDataUrl = "";

  window.switchTab = (tab) => {
    if(tab === 'login') {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('signupForm').style.display = 'none';
        document.getElementById('btnLoginTab').classList.add('active');
        document.getElementById('btnSignupTab').classList.remove('active');
    } else {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('signupForm').style.display = 'block';
        document.getElementById('btnSignupTab').classList.add('active');
        document.getElementById('btnLoginTab').classList.remove('active');
    }
  };

  window.handleAuth = async (type) => {
    let email, password;

    if(type === 'signup') {
        const fullName = document.getElementById('regFullName').value.trim();
        email = document.getElementById('regEmail').value.trim();
        password = document.getElementById('regPassword').value.trim();
        if(!fullName || !email || !password) {
            alert("Please fill out all registration fields!");
            return;
        }
        currentUserName = fullName;
    } else {
        email = document.getElementById('loginEmail').value.trim();
        password = document.getElementById('loginPassword').value.trim();
        if(!email || !password) {
            alert("Please enter Email and Password!");
            return;
        }
        currentUserName = email.split('@')[0];
    }

    try {
        if(type === 'signup') {
            await createUserWithEmailAndPassword(auth, email, password);
            alert("Account created successfully!");
        } else {
            await signInWithEmailAndPassword(auth, email, password);
            alert("Logged in successfully!");
        }
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('feedBox').style.display = 'block';
        document.getElementById('userProfileName').innerText = "Name: " + currentUserName;
        document.getElementById('userProfileEmail').innerText = "Email: " + email;
        loadDefaultFeed();
    } catch (error) {
        alert("Firebase Error: " + error.message);
    }
  };

  window.previewSelectedImage = (input) => {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            selectedImageDataUrl = e.target.result;
            const p = document.getElementById('imagePreviewText');
            p.style.display = 'block';
            p.innerText = "✓ Selected: " + input.files[0].name;
        }
        reader.readAsDataURL(input.files[0]);
    }
  };

  window.shareAppWithFriends = () => {
    const siteUrl = window.location.href;
    const shareText = `Join my Anonymous Social Network! Create your account here: ${siteUrl}`;
    
    if (navigator.share) {
        navigator.share({
            title: 'Anonymous Social Network',
            text: shareText,
            url: siteUrl
        }).catch(() => {});
    } else {
        navigator.clipboard.writeText(siteUrl);
        alert("Website link copied to clipboard! Share it with your friends via WhatsApp or SMS.");
    }
  };

  window.searchUsers = () => {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const resultsBox = document.getElementById('searchResults');
    
    if(!query) {
        resultsBox.style.display = 'none';
        return;
    }
    
    resultsBox.style.display = 'block';
    resultsBox.innerHTML = `
        <div class="user-item">
            <span>👤 ${query}_user</span>
            <button class="btn-primary btn-small" id="btn_${query}" onclick="sendFriendRequest('${query}')">➕ Add Friend</button>
        </div>
    `;
  };

  window.sendFriendRequest = (name) => {
    const btn = document.getElementById('btn_' + name);
    btn.innerText = "⏳ Request Sent";
    btn.className = "btn-secondary btn-small";
    alert("Friend request sent to " + name + "!");
  };

  let postCount = 0;
  window.createPost = () => {
    const text = document.getElementById('postContent').value.trim();
    if(!text && !selectedImageDataUrl) {
        alert("Kuch likhein ya picture upload karein!");
        return;
    }
    
    addPostToFeed(currentUserName, text, selectedImageDataUrl);
    document.getElementById('postContent').value = '';
    document.getElementById('imageUpload').value = '';
    document.getElementById('imagePreviewText').style.display = 'none';
    selectedImageDataUrl = "";
  };

  function addPostToFeed(author, text, imgUrl = "") {
    postCount++;
    const postId = 'post_' + postCount;
    let imageHTML = imgUrl ? `<img src="${imgUrl}" class="post-image" onerror="this.style.display='none'">` : '';

    const postHTML = `
        <div class="post-card" id="${postId}">
            <div class="post-header">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Anonymous_emblem.svg" class="avatar" alt="User">
                <div>
                    <div style="font-weight: bold;">${author}</div>
                    <div style="font-size: 11px; color: #b0b3b8;">Just now</div>
                </div>
            </div>
            <div>${text}</div>
            ${imageHTML}
            
            <div class="reactions-container">
                <div class="reaction-box" id="reactBox_${postId}">
                    <span onclick="setReaction('${postId}', '👍', 'Like')">👍</span>
                    <span onclick="setReaction('${postId}', '❤️', 'Love')">❤️</span>
                    <span onclick="setReaction('${postId}', '😆', 'Haha')">😆</span>
                    <span onclick="setReaction('${postId}', '😮', 'Wow')">😮</span>
                    <span onclick="setReaction('${postId}', '😢', 'Sad')">😢</span>
                    <span onclick="setReaction('${postId}', '🩴', 'Chapal')">🩴</span>
                </div>

                <div class="post-actions">
                    <button class="action-btn" id="reactBtn_${postId}" onclick="toggleReactionBox('${postId}')">
                        <span class="icon">👍</span> <span class="label">Like</span> (<span class="count">0</span>)
                    </button>
                    <button class="action-btn" onclick="toggleCommentSection('${postId}')">💬 Comment</button>
                    <button class="action-btn" onclick="shareAppWithFriends()">🔄 Share App</button>
                </div>
            </div>
            
            <div class="comment-section" id="comments_${postId}">
                <div class="comment-list-container"></div>
                <div class="comment-input-group">
                    <input type="text" placeholder="Write a comment..." class="c-input">
                    <button class="btn-primary btn-small" onclick="addComment('${postId}')">Send</button>
                </div>
            </div>
        </div>
    `;
    document.getElementById('postsContainer').insertAdjacentHTML('afterbegin', postHTML);
  }

  window.toggleReactionBox = (postId) => {
    const box = document.getElementById('reactBox_' + postId);
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
  };

  window.setReaction = (postId, icon, label) => {
    const btn = document.getElementById('reactBtn_' + postId);
    const box = document.getElementById('reactBox_' + postId);
    
    btn.querySelector('.icon').innerText = icon;
    btn.querySelector('.label').innerText = label;
    btn.querySelector('.label').style.color = '#00f2fe';
    
    let countSpan = btn.querySelector('.count');
    countSpan.innerText = parseInt(countSpan.innerText) + 1;
    box.style.display = 'none';
  };

  window.toggleCommentSection = (postId) => {
    const section = document.getElementById('comments_' + postId);
    section.style.display = section.style.display === 'block' ? 'none' : 'block';
  };

  window.addComment = (postId) => {
    const input = document.querySelector(`#${postId} .c-input`);
    const val = input.value.trim();
    if(!val) return;
    
    const container = document.querySelector(`#${postId} .comment-list-container`);
    container.insertAdjacentHTML('beforeend', `<div class="comment-list"><b>${currentUserName}:</b> ${val}</div>`);
    input.value = '';
  };

  window.toggleProfile = () => {
    const p = document.getElementById('profileBox');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
  };

  function loadDefaultFeed() {
    addPostToFeed('Anonymous Admin', 'Welcome to Anonymous Social Network! Dark Hacker / Anonymous background theme applies perfectly. 🎉');
  }
</script>
</body>
    </html>
