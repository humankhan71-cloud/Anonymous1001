<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous1001</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .logo { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #00f2fe; margin-bottom: 12px; object-fit: cover; }
        h2 { color: #00f2fe; margin-bottom: 6px; font-size: 22px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: #00f2fe; }
        button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-login { background: #00f2fe; color: #000; }
        .btn-signup { background: #00c853; color: #fff; margin-top: 8px; }
        #feedBox { text-align: left; }
        .post-input-box { background: #0d1117; padding: 12px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 15px; }
        textarea { width: 100%; background: transparent; border: none; color: #fff; resize: none; outline: none; font-size: 14px; }
    </style>
</head>
<body>

<!-- Login / Signup Box -->
<div class="card" id="authBox">
    <img src="https://api.iconify.design/ion:person-circle-outline.svg?color=%2300f2fe" class="logo" alt="Logo">
    <h2>Anonymous Network</h2>
    <p>Login or Sign up to connect</p>
    
    <input type="email" id="email" placeholder="Email address">
    <input type="password" id="password" placeholder="Password (min 6 characters)">
    
    <button class="btn-login" onclick="handleAuth('login')">Log In</button>
    <button class="btn-signup" onclick="handleAuth('signup')">Create New Account</button>
</div>

<!-- Social Feed Box (Login Ke Baad Khulega) -->
<div class="card" id="feedBox" style="display: none;">
    <h2 style="text-align: center;">Anonymous Feed 🎉</h2>
    <p style="text-align: center;" id="userWelcome"></p>

    <div class="post-input-box">
        <textarea id="postText" rows="3" placeholder="What's on your mind?"></textarea>
        <button class="btn-login" onclick="alert('Posting is live!')">Post Now</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // AAPKI SET KI HUI FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "C377499f24cef586d2dd92049ba65a27",
    authDomain: "anonymous1001-d2a27.firebaseapp.com",
    projectId: "anonymous1001-d2a27",
    storageBucket: "anonymous1001-d2a27.appspot.com",
    messagingSenderId: "103859600122",
    appId: "1:103859600122:web:a2f60100f2fe1001"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.handleAuth = async (type) => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if(!email || !password) {
        alert("Khabardar: Email aur Password dono likhein!");
        return;
    }

    if(password.length < 6) {
        alert("Password kam se kam 6 digits ka hona chahiye!");
        return;
    }

    try {
        if(type === 'signup') {
            await createUserWithEmailAndPassword(auth, email, password);
            alert("Mubarak ho! Account kamyabi se ban gaya.");
        } else {
            await signInWithEmailAndPassword(auth, email, password);
            alert("Kamyabi se Login ho gaye!");
        }
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('feedBox').style.display = 'block';
        document.getElementById('userWelcome').innerText = "Logged in as: " + email;
    } catch (error) {
        alert("Firebase Error: " + error.message);
    }
  };
</script>
</body>
  </html>
